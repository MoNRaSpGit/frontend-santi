<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Santi</title>
    <meta name="theme-color" content="#1f7a4d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@500&display=swap" />
  </head>
  <body>
<main>
  <header>
    <div class="brand">
      <img src="./icon-192.png" alt="" width="48" height="48" />
      <h1>Santi</h1>
    </div>
  </header>
  <p class="status" id="status" hidden></p>
  <div class="search">
    <label for="search">Buscar cliente</label>
    <input id="search" type="search" placeholder="Nombre o calle" autocomplete="off">
  </div>
  <div id="results" aria-live="polite"></div>
  <div class="tabs" role="tablist">
    <button type="button" class="tab" role="tab" id="tab-pedidos" aria-selected="true">Pedidos</button>
    <button type="button" class="tab" role="tab" id="tab-pagos" aria-selected="false">Pagos</button>
    <button type="button" class="tab" role="tab" id="tab-clientes" aria-selected="false">Clientes</button>
    <button type="button" class="tab" role="tab" id="tab-cocina" aria-selected="false">Cocina</button>
    <div class="more">
      <button type="button" class="tab more-btn" id="more-btn" aria-haspopup="true" aria-expanded="false" aria-label="Más secciones">☰</button>
      <div class="more-menu" id="more-menu" hidden>
        <button type="button" class="more-item" role="tab" id="tab-panel" aria-selected="false">Panel</button>
        <button type="button" class="more-item" role="tab" id="tab-menu" aria-selected="false">Configuración</button>
        <button type="button" class="more-item" role="tab" id="tab-historial" aria-selected="false">Historial de pagos</button>
      </div>
    </div>
  </div>
  <div class="pane" id="pane-pedidos">
    <button type="button" class="order-cta" id="ordertoggle">+ Nuevo pedido</button>
    <div id="orderbox" aria-live="polite"></div>
    <div class="pay-list" id="orderlist"></div>
  </div>
  <div class="pane" id="pane-pagos" hidden>
    <div class="total"><span>Nos deben en total</span><strong id="total">$ 0</strong></div>
    <ul id="list"></ul>
  </div>
  <div class="pane" id="pane-menu" hidden>
    <div id="prices"></div>
    <h3 class="chart-title">Menú de la semana</h3>
    <div id="menus" style="display:flex;flex-direction:column;gap:10px"></div>
    <button type="button" class="reset" id="reset">Reiniciar ejemplo</button>
  </div>
  <div class="pane" id="pane-clientes" hidden>
    <button type="button" id="addtoggle">+ Ingresar cliente</button>
    <form class="addform" id="addform" hidden>
      <div class="f">
        <label for="add-name">Nombre del cliente</label>
        <input id="add-name" type="text" autocomplete="off" placeholder="Ej: Carlos">
      </div>
      <div class="f">
        <label for="add-addr">Calle o descripción</label>
        <input id="add-addr" type="text" autocomplete="off" placeholder="Ej: Avenida 18 de Julio 1234, casa verde">
      </div>
      <span class="err" id="add-err" hidden></span>
      <div class="mactions">
        <button type="submit">Guardar cliente</button>
        <button type="button" class="btn-ghost" id="add-cancel">Cancelar</button>
      </div>
    </form>
    <span class="addmsg" id="addmsg" hidden></span>
    <ul id="clientlist"></ul>
  </div>
  <div class="pane" id="pane-cocina" hidden>
    <div id="kitchen"></div>
  </div>
  <div class="pane" id="pane-panel" hidden>
    <h2 class="panel-month" id="panel-month"></h2>
    <div class="stats">
      <div class="stat"><span class="stat-label">Vendí este mes</span><strong class="stat-value" id="st-sold">$ 0</strong><span class="stat-hint" id="st-count"></span></div>
      <div class="stat stat-profit"><span class="stat-label">Ganancia (30%)</span><strong class="stat-value" id="st-profit">$ 0</strong><span class="stat-hint">Estimada sobre lo vendido</span></div>
      <div class="stat"><span class="stat-label">Nos deben</span><strong class="stat-value" id="st-owed">$ 0</strong><span class="stat-hint" id="st-owed-n"></span></div>
    </div>
    <div class="chart-card">
      <h3 class="chart-title">Ventas de los últimos 7 días</h3>
      <div id="chart"></div>
    </div>
    <div class="mhead">
      <h3 class="chart-title">Movimientos del mes</h3>
      <button type="button" class="btn-ghost btn-small" id="mov-toggle" hidden>Ver todos</button>
    </div>
    <div class="pay-list" id="movlist"></div>
  </div>
  <div class="pane" id="pane-historial" hidden>
    <div class="total"><span>Cobrado en total</span><strong id="paid-total">$ 0</strong></div>
    <div class="search">
      <label for="hist-filter">Ver pagos de</label>
      <select id="hist-filter"></select>
    </div>
    <div class="pay-list" id="paylist"></div>
  </div>
</main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
